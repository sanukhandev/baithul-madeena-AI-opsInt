name: Package production artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parent and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_GRAPHQL_URL: /graphql
        run: |
          npm ci
          npm run build

      - name: Package frontend artifact
        run: |
          test -d frontend/dist
          mkdir -p artifacts
          (cd frontend/dist && zip -qr "../../artifacts/frontend-dist.zip" .)

      - name: Package backend without vendor or environment files
        run: |
          mkdir -p artifacts
          (cd backend && zip -qr "../artifacts/backend-app-no-vendor.zip" . \
            -x 'vendor/*' '.env' '.env.*' 'storage/app/*' 'storage/logs/*' \
            'node_modules/*' '.git/*')

      - name: Write artifact manifest
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "frontend_build=frontend/dist"
            echo "graphql_url=/graphql"
            echo "backend_vendor=excluded; copy/install separately on server"
            echo "environment_files=excluded"
          } > artifacts/MANIFEST.txt

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: erp-production-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
